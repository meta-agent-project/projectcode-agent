name: 따라치기와 wiki 배포

on:
  push:
    branches: [main]
    paths:
      - ".projectcode/code/**"
      - ".projectcode/wiki/**"
      - ".projectcode/roadmap.md"
      - ".claude/skills/projectcode-deploy/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 사이트 폴더 만들기
        run: node .claude/skills/projectcode-deploy/site.mjs _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
